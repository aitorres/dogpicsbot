[tool.poetry]
name = "dogpicsbot"
version = "3.2.0"
description = "A simple Telegram bot that sends random dog pictures (and more!)."
authors = ["Andrés Ignacio Torres <dev@aitorres.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
python-dotenv = "^1.2.4"
python-telegram-bot = "^22.8"
requests = "^2.34.2"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.4.1"
black = "^26.10.1"
pre-commit = "^4.6.1"
isort = "^9.0.2"
pylint = "^4.1.3"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pytest-trio = "^0.8.0"
pytest-tornasync = "^0.6.0.post2"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
